# Netlify configuration – static site, no build step.
[build]
  publish = "."

# Old URLs keep working even if shared or bookmarked.
[[redirects]]
  from = "/portfolio.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/thank-you.html"
  to = "/thank-you/"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy/"
  status = 301
  force = true

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
